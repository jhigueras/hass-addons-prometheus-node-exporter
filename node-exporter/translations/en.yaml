configuration:
  log_level:
    name: Log Level
    description: Logging level for the add-on
  enable_basic_auth:
    name: Enable HTTP Basic Authentication
    description: Must be true. The add-on refuses to start with Basic Auth disabled.
  basic_auth_user:
    name: Username
    description: Username for Prometheus to use when scraping this endpoint
  basic_auth_bcrypt_hash:
    name: Bcrypt Password Hash
    description: >-
      Bcrypt hash of the scrape password. Must start with $2a$, $2b$, or $2y$.
      Generate with: htpasswd -nBC 12 '' | tr -d ':\n'
      The Prometheus scraper uses the plaintext password; this add-on stores only the hash.
  enable_tls:
    name: Enable TLS
    description: Enable HTTPS. Requires cert_file and cert_key.
  cert_file:
    name: TLS Certificate
    description: Path to the TLS certificate (e.g. /ssl/fullchain.pem)
  cert_key:
    name: TLS Private Key
    description: Path to the TLS private key (e.g. /ssl/privkey.pem)
  collectors:
    name: Metrics Collectors
    description: Enable or disable individual collectors. All others are disabled by default.
  cpu:
    name: CPU
    description: CPU usage and time counters
  meminfo:
    name: Memory
    description: Memory usage statistics
  diskstats:
    name: Disk I/O
    description: Disk I/O counters
  netdev:
    name: Network Interfaces
    description: Network interface counters (virtual interfaces excluded by default)
  netstat:
    name: Network Stack
    description: Network protocol statistics
  filesystem:
    name: Filesystem
    description: Filesystem capacity and usage (proc/sys/docker mounts excluded by default)
  loadavg:
    name: Load Average
    description: System load average
  time:
    name: Clock
    description: System clock and time metrics
  wifi:
    name: WiFi
    description: WiFi statistics (disabled by default)
  hwmon:
    name: Hardware Sensors
    description: Hardware temperature, fan, and voltage sensors (CPU temperature on RPi)
