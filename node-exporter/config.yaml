---
name: Hardened Node Exporter
version: 2026.1.2
slug: hardened-node-exporter
description: >-
  Exposes HAOS host health metrics for Prometheus. Hardened fork of the RACKSYNC
  community add-on. Requires Basic Auth. Does not expose Home Assistant,
  Supervisor, Auth, or Docker APIs. Intended for internal LAN scraping only
  — never expose through Caddy, WAN, or public DNS.
url: https://github.com/jhigueras/hass-addons-prometheus-node-exporter
arch:
  - amd64
  - aarch64
init: false
ports:
  9100/tcp: 9100
ports_description:
  9100/tcp: Prometheus metrics endpoint (Basic Auth required)
map:
  - addon_config:rw
  - ssl:ro
startup: services
boot: auto
host_network: true
apparmor: true
host_pid: true
homeassistant: "2023.8.1"
stage: stable
hassio_api: false
homeassistant_api: false
auth_api: false
docker_api: false
ingress: false
options:
  enable_basic_auth: true
  basic_auth_user: "prometheus"
  basic_auth_bcrypt_hash: ""
  enable_tls: false
  cert_file: ""
  cert_key: ""
  log_level: "info"
  collectors:
    cpu: true
    meminfo: true
    diskstats: true
    netdev: true
    netstat: true
    filesystem: true
    loadavg: true
    time: true
    wifi: false
    hwmon: true
schema:
  enable_basic_auth: bool
  basic_auth_user: str
  basic_auth_bcrypt_hash: str
  enable_tls: bool
  cert_file: str?
  cert_key: str?
  log_level: list(trace|debug|info|warn|error)?
  collectors:
    cpu: bool?
    meminfo: bool?
    diskstats: bool?
    netdev: bool?
    netstat: bool?
    filesystem: bool?
    loadavg: bool?
    time: bool?
    wifi: bool?
    hwmon: bool?
